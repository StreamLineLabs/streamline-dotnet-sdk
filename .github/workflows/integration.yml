name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC
  workflow_dispatch:
    inputs:
      image:
        description: Streamline server image to test against
        required: false
        type: string

# The Streamline server image is configurable rather than hard-coded, so the job can be
# pointed at whatever build is published.
env:
  STREAMLINE_IMAGE: ${{ inputs.image || vars.STREAMLINE_IMAGE || 'ghcr.io/streamlinelabs/streamline:latest' }}

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      - name: Start Streamline server
        run: docker compose -f docker-compose.test.yml up -d --wait

      # The test fixture performs its own bounded readiness probe and fails the run if
      # the server is unreachable, so no silent-skip fallback is needed here.
      - name: Run integration tests
        run: dotnet test --no-build --configuration Release --filter "Category=Integration" --verbosity normal
        env:
          STREAMLINE_INTEGRATION: "1"
          STREAMLINE_BOOTSTRAP_SERVERS: localhost:9092
          STREAMLINE_HTTP_URL: http://localhost:9094
          STREAMLINE_READY_TIMEOUT_SECONDS: "60"

      - name: Dump server logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Stop Streamline server
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
